name: CI

# Runs on every PR and on pushes to main. Validates static analysis, binary API
# compatibility, the JVM/common unit tests, the Roborazzi golden screenshots, and
# (on macOS) that the iOS targets still compile.
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Detekt + API check + tests (JVM)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Detekt (static analysis)
        run: ./gradlew detekt

      - name: Binary API compatibility check
        run: ./gradlew apiCheck

      - name: JVM + common unit tests
        run: ./gradlew :kwave:jvmTest

      - name: Roborazzi golden screenshot verification
        # verifyRoborazzi fails the build if any golden image drifts. Generate
        # baselines locally with `./gradlew :kwave:recordRoborazzi` and commit them.
        run: ./gradlew :kwave:verifyRoborazziDebug

      - name: Upload Roborazzi diff reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-reports
          path: |
            **/build/outputs/roborazzi/
            **/build/reports/roborazzi/
          retention-days: 7

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            **/build/reports/detekt/
          retention-days: 7

  ios:
    name: Compile iOS targets (macOS)
    runs-on: macos-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile iOS arm64 + simulator arm64
        run: ./gradlew :kwave:compileKotlinIosArm64 :kwave:compileKotlinIosSimulatorArm64

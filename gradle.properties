#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache is intentionally left OFF: the vanniktech maven-publish
# plugin and some KMP publishing tasks are not yet fully configuration-cache
# compatible. Re-enable once the toolchain supports it end to end.

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin Multiplatform
kotlin.mpp.androidSourceSetLayoutVersion=2
# Silence the "this is a Kotlin/Native experimental target" style noise on iOS.
kotlin.native.ignoreDisabledTargets=true

# ---------------------------------------------------------------------------
# Maven Central coordinates (consumed by com.vanniktech.maven.publish).
# GROUP + VERSION_NAME + POM_* below feed the generated POM automatically.
# ---------------------------------------------------------------------------
GROUP=red.rankorr
VERSION_NAME=0.1.0-SNAPSHOT

POM_NAME=KWave
POM_DESCRIPTION=Animated, customizable layered wave hero backgrounds for Compose Multiplatform (Android, iOS, JVM).
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/Shyzkanza/KWave

POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/Shyzkanza/KWave
POM_SCM_CONNECTION=scm:git:git://github.com/Shyzkanza/KWave.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/Shyzkanza/KWave.git

POM_DEVELOPER_ID=shyzkanza
POM_DEVELOPER_NAME=Jessy Bonnotte
POM_DEVELOPER_URL=https://github.com/Shyzkanza
